name: CypherAI API image

# The one file this fork adds on the `cypher` branch, and the reason the branch exists.
#
# The deployment bundle pins the API image by digest, and that image has to be built
# from *this* branch: running upstream's prebuilt image would serve stock LibreChat and
# make everything the fork carries — the theme loader, the Albanian locale — invisible
# no matter how well it was built.
#
# Built here rather than on the engineer's machine because that machine is arm64 and the
# demo host is amd64. A local build would pin an image the host cannot run, and would
# find that out at deploy time.
#
# Both architectures are built, and both are load-bearing: amd64 is what the demo host
# runs, and arm64 is what lets the bundle be brought up and verified on the engineer's
# machine before it reaches the host.
#
# Each architecture builds on its own native runner and the two are merged into one
# index afterwards. Building both on one runner under QEMU is the obvious alternative
# and was rejected: an emulated arm64 Node build is slow enough to sit near the job
# timeout, which turns a slow build into a failed one. Upstream splits its legs the same
# way.
#
# See ensquare-ai/cypherai-platform#37, and ADR-0001 for the fork discipline this serves.

on:
  push:
    branches: [cypher]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ensquare-ai/cypherai-api

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, unnamed. Neither leg is the image; the index built in the
      # merge job is, and tagging a leg would briefly publish a single-architecture
      # image under the name the deployment pulls.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multi
          target: api-build
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Attestations would add extra manifests to the index. The bundle's pin test
          # expects a plain multi-platform image index, so keep the index plain.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export the leg's digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.slug }}-${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the leg's digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the legs' digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit only, never `latest`. A floating tag is exactly what slice 0.1
      # eliminated for the eval rig, and the product bundle pins the digest this
      # produces rather than any tag.
      - name: Create the index
        run: |
          set -euo pipefail
          cd /tmp/digests
          refs=""
          for f in *; do
            refs="$refs ${IMAGE}@sha256:${f#*-}"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_SHA}" $refs

      # The digest the deployment pins. It is the *index* digest, not a per-platform
      # manifest digest — pinning the amd64 sub-manifest would break the pin on arm64,
      # which is the rule deploy/rig-manifest.toml already records.
      - name: Report the digest to pin
        run: |
          set -euo pipefail
          # Command substitution rather than `read`: `imagetools inspect --format`
          # emits no trailing newline, and `read` reports failure at EOF even once it
          # has assigned every variable — which under `set -e` fails the step after the
          # work has already succeeded.
          INSPECTED=$(
            docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
              --format '{{.Manifest.MediaType}} {{.Manifest.Digest}}'
          )
          MEDIA_TYPE=${INSPECTED%% *}
          DIGEST=${INSPECTED##* }
          if [ "$MEDIA_TYPE" != "application/vnd.oci.image.index.v1+json" ]; then
            echo "::error::expected an image index, got ${MEDIA_TYPE} — the pin would be single-platform"
            exit 1
          fi
          {
            echo "## Image built from \`cypher\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| repository | \`${IMAGE}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| media type | \`${MEDIA_TYPE}\` |"
            echo "| **index digest** | \`${DIGEST}\` |"
            echo
            echo "Pin this digest in \`deploy/product-manifest.toml\`. Rebuilding the same"
            echo "commit produces a different digest, so the digest is what a deployment"
            echo "pins — never the branch name and never the tag."
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'index digest: %s\n' "$DIGEST"
